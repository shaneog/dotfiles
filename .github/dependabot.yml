version: 2

updates:
  # Only the workflows' `uses:` refs. Nothing else here is a package ecosystem
  # Dependabot understands: the Brewfile and the zsh plugins are not covered.
  #
  # Worth knowing what this is and is not for: the refs are pinned to major tags,
  # which already float forward across patches, so this is not what keeps them
  # patched. It surfaces *major* bumps -- the ones that can break -- and the suite
  # runs on the pull request, which is the actual point.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One pull request for all of them rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
