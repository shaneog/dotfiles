name: provision

# The scripts that set up a machine are the ones with the widest blast radius and
# the least coverage: they only ever run on a fresh Mac, so their bugs hide until
# the next new machine. GitHub's macOS runners are disposable VMs, so they can be
# exercised for real here.
#
# Not run on push: minutes are cheap but not free, and none of this is affected
# by a typical change.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, early

# Neither workflow writes to the repository: it checks out, installs tools and
# runs tests. The repository default is a write token, which is more than any of
# this needs.
permissions:
  contents: read

concurrency:
  group: provision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: setup into a used home, then a first shell
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install what the Brewfile provides for the shell
        run: brew install direnv fzf starship

      # A real home that has already been lived in: an externally managed shell
      # setup, and other tools' files under ~/.config.
      - name: Seed a used home
        run: |
          HOME_UNDER_TEST="$RUNNER_TEMP/home"
          echo "HOME_UNDER_TEST=$HOME_UNDER_TEST" >> "$GITHUB_ENV"
          mkdir -p "$HOME_UNDER_TEST/.config/some-other-tool"
          echo "keep me" > "$HOME_UNDER_TEST/.config/some-other-tool/state"
          # Valid shell, because the shell actually sources these; the export
          # doubles as proof further down that the base layer is honoured.
          for f in .profile .bashrc .zprofile .zshrc; do
            printf '# MANAGED %s\nexport MANAGED_SENTINEL=%s\n' "$f" "$f" \
              > "$HOME_UNDER_TEST/$f"
          done
          ( cd "$HOME_UNDER_TEST" && shasum .profile .bashrc .zprofile .zshrc \
              > "$RUNNER_TEMP/managed.sha" )

      - name: Run script/setup
        run: HOME="$HOME_UNDER_TEST" ./script/setup

      - name: The links point into the repo
        run: |
          set -x
          [ -L "$HOME_UNDER_TEST/.zshenv" ]
          [ "$HOME_UNDER_TEST/.zshenv" -ef "$PWD/config/zsh/.zshenv" ]
          [ "$HOME_UNDER_TEST/.config" -ef "$PWD/config" ]
          [ "$HOME_UNDER_TEST/.Brewfile" -ef "$PWD/Brewfile" ]

      - name: An externally managed shell setup is left alone
        run: ( cd "$HOME_UNDER_TEST" && shasum -c "$RUNNER_TEMP/managed.sha" )

      - name: Pre-existing files are backed up, not destroyed
        run: |
          rescued="$(cat "$HOME_UNDER_TEST"/.config.bak.*/some-other-tool/state)"
          [ "$rescued" = "keep me" ] || { echo "content was destroyed"; exit 1; }

      - name: Repo scaffolding stays out of home
        run: |
          for f in .test .Makefile .script .github; do
            [ ! -e "$HOME_UNDER_TEST/$f" ] || { echo "setup linked $f"; exit 1; }
          done

      - name: Running it again changes nothing
        run: |
          snapshot() {
            for f in "$HOME_UNDER_TEST"/.*; do
              case "${f##*/}" in .|..) continue ;; esac
              if [ -L "$f" ]; then echo "${f##*/} -> $(readlink "$f")"
              elif [ -d "$f" ]; then echo "${f##*/} (dir)"
              else echo "${f##*/} (file)"; fi
            done | sort
          }
          before="$(snapshot)"
          HOME="$HOME_UNDER_TEST" ./script/setup
          after="$(snapshot)"
          [ "$before" = "$after" ] || { diff <(echo "$before") <(echo "$after"); exit 1; }

      # The real prize: a first interactive shell on a machine that has never had
      # one. This installs every plugin and runs every clone hook, which is where
      # the fzf and direnv hook bugs were hiding.
      - name: A first login shell installs cleanly
        run: |
          HOME="$HOME_UNDER_TEST" TERM=xterm-256color ZSH_NO_TMUX_AUTOSTART=1 \
            zsh -lic 'true' 2>first.err || { echo "first shell failed"; cat first.err; exit 1; }
          if grep -iE "permission denied|returned with 1[0-9][0-9]" first.err; then
            echo "an install hook failed"; exit 1
          fi

      - name: A second login shell is silent and has its integrations
        run: |
          HOME="$HOME_UNDER_TEST" TERM=xterm-256color ZSH_NO_TMUX_AUTOSTART=1 \
            zsh -lic 'true' 2>second.err
          noise="$(grep -v "can't change option: zle" second.err | grep '[[:alpha:]]' || true)"
          [ -z "$noise" ] || { echo "unexpected stderr: $noise"; exit 1; }
          HOME="$HOME_UNDER_TEST" TERM=xterm-256color ZSH_NO_TMUX_AUTOSTART=1 \
            zsh -lic 'print "starship=$+functions[prompt_starship_precmd] direnv=$+functions[_direnv_hook] fzf=$+functions[fzf-file-widget] dump=$([[ -s $ZSH_COMPDUMP ]] && print yes || print no)"' \
            | tee shell.out
          grep -q "starship=1 direnv=1 fzf=1 dump=yes" shell.out || {
            echo "a first shell did not end up fully wired"; exit 1; }
          # the externally managed files are layered under ours, so their
          # exports must survive into the final environment
          HOME="$HOME_UNDER_TEST" TERM=xterm-256color ZSH_NO_TMUX_AUTOSTART=1 \
            zsh -lic 'print "base=$MANAGED_SENTINEL"' | grep -q "base=.zshrc" || {
              echo "the managed base layer was not sourced"; exit 1; }

  brewfile:
    name: Brewfile resolves
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Casks are gigabytes and several need a GUI, so validate everything but
      # only install the formulae.
      - name: Every entry resolves
        run: brew bundle check --file Brewfile --verbose || true
      - name: Formulae install
        run: |
          grep -E "^(tap|brew) " Brewfile > Brewfile.formulae
          brew bundle install --file Brewfile.formulae --no-upgrade

  macos-defaults:
    name: script/macos applies
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run it
        run: ./script/macos
      # --check reads the same table the apply pass used, so this covers every
      # setting rather than a hand-picked four that drift out of step.
      - name: Every setting it claims to apply is applied
        run: ./script/macos --check

  remove:
    name: script/remove tears down
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The repo has to live at ~/.dotfiles, as it does on a real machine: the
      # symlinks then point inside it, so removing it leaves them broken, which
      # is what remove's find-and-delete relies on. A symlink to the workspace
      # would leave every other link intact and the teardown looking successful.
      - name: Install from a real ~/.dotfiles
        run: |
          HOME_UNDER_TEST="$RUNNER_TEMP/home"
          echo "HOME_UNDER_TEST=$HOME_UNDER_TEST" >> "$GITHUB_ENV"
          mkdir -p "$HOME_UNDER_TEST"
          cp -R "$PWD" "$HOME_UNDER_TEST/.dotfiles"
          ( cd "$HOME_UNDER_TEST/.dotfiles" && HOME="$HOME_UNDER_TEST" ./script/setup )
          [ "$HOME_UNDER_TEST/.zshenv" -ef "$HOME_UNDER_TEST/.dotfiles/config/zsh/.zshenv" ]
      # It asks for confirmation, so without input it would no-op and pass
      # vacuously. It also uninstalls Homebrew, hence its own job.
      - name: Run it
        run: |
          cd "$HOME_UNDER_TEST/.dotfiles"
          yes | HOME="$HOME_UNDER_TEST" ./script/remove || true

      - name: The dotfiles and their dangling links are gone
        run: |
          set -x
          [ ! -e "$HOME_UNDER_TEST/.dotfiles" ]
          for link in .zshenv .config .ssh .Brewfile; do
            [ ! -L "$HOME_UNDER_TEST/$link" ] || {
              echo "$link survived as a dangling link"; exit 1; }
          done

      # The whole point of the rescope: removing the dotfiles must not take the
      # machine's toolchain with them.
      - name: ...but Homebrew is untouched
        run: |
          command -v brew >/dev/null || { echo "default removal took Homebrew out"; exit 1; }
          brew list --formula --versions git >/dev/null \
            || { echo "default removal uninstalled packages"; exit 1; }

      # Run from the workspace, since the clone it was installed from is gone.
      - name: --everything does take Homebrew
        run: yes | HOME="$HOME_UNDER_TEST" ./script/remove --everything || true

      - name: Homebrew is gone
        run: |
          [ ! -x /opt/homebrew/bin/brew ] || { echo "--everything left Homebrew behind"; exit 1; }

  bootstrap:
    name: bootstrap end to end
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Casks are gigabytes and most of them need a GUI. brew bundle can skip
      # named dependencies through the environment, so neither the Brewfile nor
      # the script needs a test-only escape hatch.
      - name: Skip the casks
        run: |
          casks="$(grep -oE "^cask '[^']+'" Brewfile | cut -d\' -f2 | tr '\n' ' ')"
          echo "HOMEBREW_BUNDLE_CASK_SKIP=$casks" >> "$GITHUB_ENV"

      # Takes the fresh-machine branch -- a real clone into ~/.dotfiles, rather
      # than the pull branch -- but sourced from the checkout, so it is the code
      # under test and not whatever main happens to be.
      - name: Run script/bootstrap
        run: |
          HOME_UNDER_TEST="$RUNNER_TEMP/home"
          echo "HOME_UNDER_TEST=$HOME_UNDER_TEST" >> "$GITHUB_ENV"
          mkdir -p "$HOME_UNDER_TEST"
          ref="$(git rev-parse --abbrev-ref HEAD)"
          [ "$ref" = "HEAD" ] && ref=""    # detached: let it clone the default
          HOME="$HOME_UNDER_TEST" \
            DOTFILES_URL="$GITHUB_WORKSPACE" \
            DOTFILES_REF="$ref" \
            ./script/bootstrap

      - name: It cloned into ~/.dotfiles and linked from there
        run: |
          set -x
          [ -d "$HOME_UNDER_TEST/.dotfiles/.git" ]
          [ "$HOME_UNDER_TEST/.zshenv" -ef "$HOME_UNDER_TEST/.dotfiles/config/zsh/.zshenv" ]
          [ "$HOME_UNDER_TEST/.config" -ef "$HOME_UNDER_TEST/.dotfiles/config" ]
          [ "$HOME_UNDER_TEST/.Brewfile" -ef "$HOME_UNDER_TEST/.dotfiles/Brewfile" ]

      - name: It applied the macOS defaults
        run: |
          [ "$(defaults read com.apple.dock tilesize)" = "48" ]

      - name: It installed what the Brewfile asks for
        run: |
          for f in starship fzf direnv tmux neovim; do
            brew list --formula --versions "$f" >/dev/null || {
              echo "bootstrap did not install $f"; exit 1; }
          done

      - name: The bootstrapped machine has a working shell
        run: |
          HOME="$HOME_UNDER_TEST" TERM=xterm-256color ZSH_NO_TMUX_AUTOSTART=1 \
            zsh -lic 'print "starship=$+functions[prompt_starship_precmd] direnv=$+functions[_direnv_hook] fzf=$+functions[fzf-file-widget] dump=$([[ -s $ZSH_COMPDUMP ]] && print yes || print no)"' \
            | tee shell.out
          grep -q "starship=1 direnv=1 fzf=1 dump=yes" shell.out || {
            echo "the bootstrapped machine has an incomplete shell"; exit 1; }
