name: cold plugin cache

# Every plugin installed from nothing, at the commits config/zsh/pins.zsh names.
# Slow and entirely network bound, so it does not run on every push.
on:
  # test.yml calls this weekly and on demand.
  workflow_call:
  # A pull request that moves a pin, which is what Renovate opens. The other jobs
  # only show that a machine which already has the plugins can move to the new
  # commits; this shows that a new machine can install them.
  pull_request:
    paths:
      - config/zsh/pins.zsh
      - .github/workflows/cold.yml

permissions:
  contents: read

jobs:
  install:
    name: install from nothing
    runs-on: macos-latest
    # Its assertions finish inside a minute. Anything beyond this is a hang,
    # and there is no value in paying half an hour to find that out.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: brew install bats-core direnv fd fzf mise neovim ripgrep starship tmux tree-sitter-cli zsh-patina
      # zsh-patina's highlighter daemon, started before bats rather than by a
      # shell under test. A daemon started from inside the harness is reparented
      # holding the harness's descriptors, so bats-format-cat never sees EOF on
      # its input and bats waits forever -- twice observed as a job that passed
      # both assertions and then sat until its timeout. The other jobs are immune
      # only because their plugin-cache warm-up happens to start it first.
      #
      # This starts a daemon, not a plugin cache: the install below is still from
      # nothing, which is the point of the job.
      - name: Start the highlighter daemon
        run: zsh-patina start || true

      # Deliberately no plugin cache: installing from nothing is the point. The
      # watchdog stays as insurance against the next thing that lingers.
      - name: Install from an empty cache
        env:
          DOTFILES_COLD_CACHE: 1
        run: |
          set +e
          bats --print-output-on-failure test/integration/cold-cache.bats &
          bats_pid=$!
          ( sleep 300; kill -9 "$bats_pid" 2>/dev/null ) &
          watchdog=$!
          wait "$bats_pid"
          rc=$?
          kill "$watchdog" 2>/dev/null
          echo "bats exited with $rc"
          # If it ever lingers again, name what was still alive.
          ps -eo pid,ppid,etime,command | grep -E "zsh|bats|patina" | grep -v grep \
            || echo "    nothing of ours survived"
          exit "$rc"
