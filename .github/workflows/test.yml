name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nothing here is pinned -- zinit takes whatever is on master and the Brewfile
  # has no versions -- so upstream breakage would otherwise arrive silently, in a
  # shell rather than in a notification.
  schedule:
    - cron: '23 7 * * 1'

# Neither workflow writes to the repository: it checks out, installs tools and
# runs tests. The repository default is a write token, which is more than any of
# this needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: brew install bats-core shellcheck jq tmux gitleaks
      - name: Lint and parse every config
        run: bats --print-output-on-failure test/static

  unit:
    name: unit (${{ matrix.zsh }} zsh)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zsh: system
            path: /bin/zsh
          - zsh: homebrew
            path: /opt/homebrew/bin/zsh
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: |
          brew install bats-core
          if [ "${{ matrix.zsh }}" = "homebrew" ]; then brew install zsh; fi
      - name: Pin the zsh under test
        run: |
          "${{ matrix.path }}" --version
          echo "ZSH_BIN=${{ matrix.path }}" >> "$GITHUB_ENV"
      - name: Guard matrix and autoloaded functions
        run: bats --print-output-on-failure test/unit

  integration:
    # Layering onto a managed shell is what this repo is for, and it was only
    # ever verified against one zsh. Both builds now, as the unit tier does.
    name: integration (${{ matrix.zsh }} zsh)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zsh: system
            path: /bin/zsh
          - zsh: homebrew
            path: /opt/homebrew/bin/zsh
    steps:
      - uses: actions/checkout@v7
      - name: Pin the zsh under test
        run: |
          if [ "${{ matrix.zsh }}" = "homebrew" ]; then brew install zsh; fi
          "${{ matrix.path }}" --version
          echo "ZSH_BIN=${{ matrix.path }}" >> "$GITHUB_ENV"
      # The shell integration for these is wired up by config/zsh/lib, and the
      # Brewfile is what installs them, so the runner needs them too.
      - name: Install tooling
        run: brew install bats-core direnv docker fd fzf mise neovim ripgrep starship tmux tree-sitter-cli zsh-patina

      # The plugin set is defined by the zsh libs, so key the cache on them.
      - name: Restore plugin cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/zinit
          key: zinit-${{ runner.os }}-${{ matrix.zsh }}-${{ hashFiles('config/zsh/lib/*.zsh', 'config/zsh/.zshrc') }}
          restore-keys: zinit-${{ runner.os }}-${{ matrix.zsh }}-

      # Populates ~/.local/share/zinit, which make_home links into each fake
      # $HOME. ZDOTDIR points at the repo, so $HOME is left untouched.
      - name: Warm the plugin cache
        run: |
          # TERM matters: without it, tput writes to stderr during startup.
          warm() { ZDOTDIR="$PWD/config/zsh" TERM=xterm-256color \
                     ZSH_NO_TMUX_AUTOSTART=1 ZSH_NO_ZCOMPILE=1 \
                     zsh -lic 'true' "$@"; }
          warm
          # Second run must be quiet: the tests assert startup is silent, so a
          # still-downloading cache would surface as a confusing test failure.
          warm 2>/tmp/warm.err || true
          # Same filter the tests use: ZLE cannot initialise without a
          # controlling terminal, so that warning is harness noise.
          if grep -v "can't change option: zle" /tmp/warm.err \
               | grep -q '[[:alpha:]]'; then
            echo "plugin cache did not settle; startup still writes to stderr:"
            cat /tmp/warm.err
            exit 1
          fi

      # Startup timing is too noisy on a shared runner to gate a pull request, but
      # the weekly run should still catch a threefold regression, so the budget is
      # loose rather than absent.
      - name: Layering and setup behavior
        env:
          SKIP_PERF: ${{ github.event_name == 'schedule' && '' || '1' }}
          DOTFILES_STARTUP_BUDGET_MS: 1500
        run: bats --print-output-on-failure test/integration

  # Every plugin installed from nothing, which is the only time zinit's atclone
  # hooks run. Weekly rather than per-push: it is slow and entirely network
  # bound, and it is the one job whose failure means a new machine is broken.
  cold:
    name: cold plugin cache
    runs-on: macos-latest
    # Its two assertions finish inside a minute. Anything beyond this is a hang,
    # and there is no value in paying half an hour to find that out.
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: brew install bats-core direnv fd fzf mise neovim ripgrep starship tmux tree-sitter-cli zsh-patina
      # Deliberately no plugin cache: installing from nothing is the point.
      #
      # Watchdogged and instrumented: this job has twice passed both assertions
      # and then sat until its timeout, which reports as "cancelled" and tells
      # you nothing. Something keeps a stream open; if it happens again the
      # process list and the open descriptors say what.
      - name: Install from an empty cache
        env:
          DOTFILES_COLD_CACHE: 1
        run: |
          set +e
          bats --print-output-on-failure test/integration/cold-cache.bats &
          bats_pid=$!
          # Snapshot at 120s: the assertions finish inside a minute, so anything
          # still alive then is what the job is waiting for. The watchdog fires
          # at 300s.
          (
            sleep 120
            echo "--- 120s in, still running: ps"
            ps -eo pid,ppid,pgid,etime,stat,command \
              | grep -E "zsh|bats|patina|zinit|ssh-add" | grep -v grep
            echo "--- 120s in, bats descriptors"
            lsof -c bats 2>/dev/null | head -25
          ) &
          sampler=$!
          ( sleep 300; kill -9 "$bats_pid" 2>/dev/null ) &
          watchdog=$!
          wait "$bats_pid"
          rc=$?
          kill "$watchdog" "$sampler" 2>/dev/null
          echo "bats exited with $rc"
          echo "--- our processes, if any survived"
          ps -eo pid,ppid,pgid,etime,stat,command \
            | grep -E "zsh|bats|patina|zinit|starship|direnv|mise|ssh-add|git " \
            | grep -v grep || echo "    none"
          echo "--- what bats had open (sampled while it was alive is not possible; this is after)"
          lsof -c bats 2>/dev/null | head -20 || echo "    bats is gone"
          echo "--- descriptors this step still holds"
          lsof -p $$ 2>/dev/null | awk '$4 ~ /^[0-9]/ {print "    " $4, $5, $9}' | head -20
          exit "$rc"

  # Breaks each thing in test/mutations.tsv and checks the named assertion
  # notices. Weekly: an assertion that has gone blind is not urgent, but it is
  # the kind of rot nothing else here would report.
  mutate:
    name: mutation manifest
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: brew install bats-core direnv docker fd fzf mise neovim ripgrep starship tmux tree-sitter-cli zsh-patina
      - name: Warm the plugin cache
        run: ZDOTDIR="$PWD/config/zsh" TERM=xterm-256color ZSH_NO_TMUX_AUTOSTART=1 zsh -lic 'true'
      - name: Every mutation must be caught
        run: script/mutate
