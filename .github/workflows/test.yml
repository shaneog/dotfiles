name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Brewfile has no versions, so a tool that changed underneath this config
  # would otherwise show up in a shell rather than in a notification.
  schedule:
    - cron: '23 7 * * 1'

# Neither workflow writes to the repository: it checks out, installs tools and
# runs tests. The repository default is a write token, which is more than any of
# this needs.
permissions:
  contents: read

# Keyed on the trigger as well as the ref. Superseding a push with a newer push
# is the point; cancelling a push run because someone asked for a manual one is
# not, and it left commits whose only completed run was the manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Ghostty for its own config check, which is the only thing that can say
      # whether Ghostty accepts the file.
      - name: Install tooling
        run: |
          brew install bats-core shellcheck jq tmux gitleaks
          brew install --cask ghostty
      - name: Lint and parse every config
        run: bats --print-output-on-failure test/static

  unit:
    name: unit (${{ matrix.zsh }} zsh)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zsh: system
            path: /bin/zsh
          - zsh: homebrew
            path: /opt/homebrew/bin/zsh
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: |
          brew install bats-core
          if [ "${{ matrix.zsh }}" = "homebrew" ]; then brew install zsh; fi
      - name: Pin the zsh under test
        run: |
          "${{ matrix.path }}" --version
          echo "ZSH_BIN=${{ matrix.path }}" >> "$GITHUB_ENV"
      - name: Guard matrix and autoloaded functions
        run: bats --print-output-on-failure test/unit

  integration:
    # Layering onto a managed shell is what this repo is for, and it was only
    # ever verified against one zsh. Both builds now, as the unit tier does.
    name: integration (${{ matrix.zsh }} zsh)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zsh: system
            path: /bin/zsh
          - zsh: homebrew
            path: /opt/homebrew/bin/zsh
    steps:
      - uses: actions/checkout@v7
      - name: Pin the zsh under test
        run: |
          if [ "${{ matrix.zsh }}" = "homebrew" ]; then brew install zsh; fi
          "${{ matrix.path }}" --version
          echo "ZSH_BIN=${{ matrix.path }}" >> "$GITHUB_ENV"
      # The shell integration for these is wired up by config/zsh/lib, and the
      # Brewfile is what installs them, so the runner needs them too: the four
      # zsh plugins are read from where Homebrew puts them. Ghostty is here for
      # its terminfo entry, which the OSC 52 test hands to tmux.
      - name: Install tooling
        run: |
          brew install bats-core direnv docker fd fzf hyperfine mise neovim ripgrep starship tmux tree-sitter-cli \
            zsh-autosuggestions zsh-completions zsh-history-substring-search zsh-patina zsh-you-should-use
          brew install --cask ghostty

      # Startup timing is too noisy on a shared runner to gate every push, so the
      # perf tier runs on the weekly schedule and on demand -- not never, which is
      # what gating it on 'schedule' alone amounted to while no schedule had yet
      # fired.
      #
      # A runner's mean lands between about 120 and 185ms, on either zsh and
      # varying from run to run, against 60ms on the fastest Mac this repo is
      # used on: slower, but not the several-times-slower a loose ceiling here
      # assumed. 400ms leaves room for a shared runner's noise without waving
      # through a real regression. The non-interactive ceiling needs no override
      # at all -- under 25ms measured here against a 50ms default.
      - name: Layering and setup behavior
        env:
          SKIP_PERF: ${{ github.event_name == 'push' && '1' || '' }}
          DOTFILES_STARTUP_BUDGET_MS: 400
        run: bats --print-output-on-failure test/integration

  # Breaks each thing in test/mutations.tsv and checks the named assertion
  # notices. Runs on every push and pull request, not weekly: the moment an
  # assertion is worth re-checking is the change that touches it, and finding out
  # on Monday that a test went blind on Tuesday is most of the value gone. It is
  # deterministic and takes about as long as the integration tier.
  mutate:
    name: mutation manifest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: |
          brew install bats-core direnv docker fd fzf hyperfine mise neovim ripgrep starship tmux tree-sitter-cli \
            zsh-autosuggestions zsh-completions zsh-history-substring-search zsh-patina zsh-you-should-use
      - name: Every mutation must be caught
        run: script/mutate
