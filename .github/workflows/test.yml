name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Brewfile has no versions, so a tool that changed underneath this config
  # would otherwise show up in a shell rather than in a notification.
  schedule:
    - cron: '23 7 * * 1'

# Neither workflow writes to the repository: it checks out, installs tools and
# runs tests. The repository default is a write token, which is more than any of
# this needs.
permissions:
  contents: read

# Keyed on the trigger as well as the ref. Superseding a push with a newer push
# is the point; cancelling a push run because someone asked for a manual one is
# not, and it left commits whose only completed run was the manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The tests that need no Mac, on the platform a pull request is most often
  # written from. A test that does need one is tagged macos (the helper file
  # says what that covers) and is left out here and nowhere else: the macOS
  # jobs below run every test, and the static tier fails if one of them stops.
  linux:
    name: linux (tests that need no Mac)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tools
      - name: Every test not tagged macos
        env:
          SKIP_PERF: ${{ github.event_name == 'push' && '1' || '' }}
          DOTFILES_STARTUP_BUDGET_MS: 400
        run: |
          bats --print-output-on-failure --filter-tags '!macos' \
            test/static test/unit test/integration

  static:
    name: static checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - name: Lint and parse every config
        run: bats --print-output-on-failure test/static
      # The mutation job is on Linux, and a row whose tests all need a Mac is
      # not checked there. Those few are run here, in the shortest macOS job.
      # A sixth macOS job would wait for one of the other five to finish.
      # Monday's run checks every row here, so that each is still watched
      # failing on macOS once a week.
      - name: The mutations only a Mac can check
        run: script/mutate ${{ github.event_name != 'schedule' && '--needs-a-mac' || '' }}

  unit:
    name: unit (${{ matrix.zsh }} zsh)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zsh: system
            path: /bin/zsh
          - zsh: homebrew
            path: /opt/homebrew/bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - name: Pin the zsh under test
        run: |
          "${{ matrix.path }}" --version
          echo "ZSH_BIN=${{ matrix.path }}" >> "$GITHUB_ENV"
      - name: Guard matrix and autoloaded functions
        run: bats --print-output-on-failure test/unit

  integration:
    # Layering onto a managed shell is what this repo is for, and it was only
    # ever verified against one zsh. Both builds now, as the unit tier does.
    name: integration (${{ matrix.zsh }} zsh)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - zsh: system
            path: /bin/zsh
          - zsh: homebrew
            path: /opt/homebrew/bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - name: Pin the zsh under test
        run: |
          "${{ matrix.path }}" --version
          echo "ZSH_BIN=${{ matrix.path }}" >> "$GITHUB_ENV"

      # Startup timing is too noisy on a shared runner to gate every push, so the
      # perf tier runs on the weekly schedule and on demand -- not never, which is
      # what gating it on 'schedule' alone amounted to while no schedule had yet
      # fired.
      #
      # A runner's mean lands between about 120 and 185ms, on either zsh and
      # varying from run to run: two to three times the fastest Mac this repo
      # is used on, but not the several-times-slower a loose ceiling here
      # assumed. 400ms leaves room for a shared runner's noise without waving
      # through a real regression. The non-interactive ceiling needs no override
      # at all -- under 25ms measured here against a 50ms default.
      - name: Layering and setup behavior
        env:
          SKIP_PERF: ${{ github.event_name == 'push' && '1' || '' }}
          DOTFILES_STARTUP_BUDGET_MS: 400
        run: bats --print-output-on-failure test/integration

  # Breaks each thing in test/mutations.tsv and checks the named assertion
  # notices. Runs on every push and pull request, not weekly: the moment an
  # assertion is worth re-checking is the change that touches it, and finding out
  # on Monday that a test went blind on Tuesday is most of the value gone.
  #
  # On Linux, because the rows are run side by side and a Linux runner has more
  # processors than a macOS one, and because GitHub runs only so many macOS jobs
  # at once. The rows whose tests need a Mac are reported here as not checked;
  # the static job runs those.
  mutate:
    name: mutation manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tools
      - name: Every mutation whose test needs no Mac must be caught
        run: script/mutate
