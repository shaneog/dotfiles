# tmux configuration.
#
# One file. The gotham colours, the pane bindings, the copy bindings and the
# sensible defaults all used to be plugins; they are twenty lines each and are
# inlined here. What is left as a plugin is the thing with no built-in
# equivalent: saving and restoring sessions across a reboot.

# ---------------------------------------------------------------- terminal

# tmux-256color is 3.7's own default; the old config asked for screen-256color,
# which is a downgrade.
set -g default-terminal "tmux-256color"

# Terminal.app has supported 24-bit colour since Tahoe and sets COLORTERM to say
# so, but the terminfo entries still advertise 256, so tmux has to be told. Asked
# rather than assumed: declaring RGB unconditionally would send 24-bit escapes to
# a terminal that only claims 256, which is how gotham ends up looking wrong over
# ssh from something older.
if-shell '[ "$COLORTERM" = truecolor ] || [ "$COLORTERM" = 24bit ]' \
  'set -as terminal-features ",*:RGB"'

# So a re-attached client brings its own answer with it.
set -ga update-environment COLORTERM

# ------------------------------------------------------------------ general

set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g monitor-activity on
set -g visual-activity on

setw -g automatic-rename on
set -g set-titles on

setw -g mode-keys vi
set -g mouse on

# Panes run zsh, which is where the rest of this repo's shell config lives.
set -g default-command zsh

# What tmux-sensible was for. escape-time and status-interval are left alone:
# tmux's own defaults are now 10 and 15, which is what the plugin was arguing
# for in the first place.
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# ----------------------------------------------------------------- bindings

# Splits and new windows open where the current pane is, which is the only part
# of tmux-pain-control worth keeping.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy to the system clipboard. This was tmux-yank, and no longer needs
# reattach-to-user-namespace: tmux has been able to reach the pasteboard
# directly since macOS 10.14.
set -g set-clipboard on
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------------------- gotham
#
# Inlined from a plugin that had been dead since tmux 2.9, when status-attr,
# window-status-fg and friends were replaced by the -style options. Sourcing it
# printed "invalid option" into nowhere, so the status bar has been running on
# tmux's default green for years. The colour indices are the ANSI slots the
# Gotham terminal profile defines.

set -g status-style "bg=colour8,fg=colour11"
set -g status-left-length 32
set -g status-right-length 64

setw -g window-status-style "fg=colour14,bg=colour8"
setw -g window-status-current-style "fg=colour14,bg=colour10,bold"
setw -g window-status-activity-style "fg=colour4,bg=colour8"
setw -g window-status-separator ""

set -g pane-border-style "fg=colour10"
set -g pane-active-border-style "fg=colour4"

set -g message-style "bg=colour10,fg=colour14"
set -g message-command-style "bg=colour10,fg=colour14"

set -g display-panes-active-colour colour8
set -g display-panes-colour colour14
setw -g clock-mode-colour colour40

# The prefix indicator was tmux-prefix-highlight; #{?client_prefix,...} is the
# same thing in one line. The now-playing segment is gone: it shelled out to
# AppleScript every five seconds, cost 105ms a run, and had been returning an
# error since iTunes stopped existing in 2019.
set -g status-left '#[fg=colour15,bg=colour11,bold] ❐ #S #[fg=colour11,bg=colour8,nobold]#{?client_prefix,#[fg=colour8,bg=colour4,bold] PREFIX #[fg=colour4,bg=colour8,nobold],} '
set -g status-right '#[fg=colour11] %R  %d %b #[fg=colour11,bg=colour10,bold] #h '
setw -g window-status-format "#[fg=colour11,bg=colour8] #I #W "
setw -g window-status-current-format "#[fg=colour8,bg=colour10]#[fg=colour14,bg=colour10,noreverse,bold] #I  #W #[fg=colour10,bg=colour8,nobold]"

# ------------------------------------------------------------------ plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# @plugin, not the @tpm_plugins variable the old config used: that spelling has
# been legacy for years.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @continuum-restore 'on'

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
