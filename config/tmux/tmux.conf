# tmux configuration.
#
# Colours, pane bindings, copy bindings and the general options are inlined
# rather than pulled in as plugins: each is a handful of lines. A plugin is only
# worth it for something with no built-in equivalent, which here means saving
# and restoring sessions across a reboot.

# ---------------------------------------------------------------- terminal

# tmux's own default since 3.x. screen-256color is a downgrade.
set -g default-terminal "tmux-256color"

# Terminal.app supports 24-bit colour and sets COLORTERM to say so, but the
# terminfo entries still advertise 256, so tmux has to be told. Conditional on
# purpose: declaring RGB unconditionally sends 24-bit escapes to terminals that
# only claim 256, which is what an older client over ssh will be.
if-shell '[ "$COLORTERM" = truecolor ] || [ "$COLORTERM" = 24bit ]' \
  'set -as terminal-features ",*:RGB"'

# So a re-attached client brings its own answer with it.
set -ga update-environment COLORTERM

# ------------------------------------------------------------------ general

set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g monitor-activity on
set -g visual-activity on

# Name a window for its directory rather than the command running in it: with
# several windows open in different repos, "dotfiles" and "some-service" tell
# them apart where three of "zsh" do not. At a repo root the basename is the
# repo name; deeper in, it is the subdirectory, which is the better label.
#
# Renaming a window by hand (prefix + ,) turns automatic-rename off for that
# window on its own, so a deliberate name is never overwritten.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on

setw -g mode-keys vi
set -g mouse on

# Panes run zsh, which is where the rest of this repo's shell config lives.
set -g default-command zsh

# escape-time and status-interval are deliberately unset: tmux's defaults of 10
# and 15 are already the sensible values.
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# ----------------------------------------------------------------- bindings

# Splits and new windows open where the current pane is.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy to the system clipboard. No wrapper is needed: tmux reaches the
# pasteboard directly on macOS 10.14 and later.
set -g set-clipboard on
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------------------- gotham
#
# The -style options are the current spelling; status-attr, window-status-fg and
# their siblings were removed in tmux 2.9 and are silently rejected. Colour
# indices are the ANSI slots the Gotham terminal profile defines.

set -g status-style "bg=colour8,fg=colour11"
set -g status-left-length 32
set -g status-right-length 64

setw -g window-status-style "fg=colour11,bg=colour8"
setw -g window-status-current-style "fg=colour14,bg=colour10,bold"
setw -g window-status-activity-style "fg=colour4,bg=colour8"
setw -g window-status-separator ""

set -g pane-border-style "fg=colour10"
set -g pane-active-border-style "fg=colour4"

set -g message-style "bg=colour10,fg=colour14"
set -g message-command-style "bg=colour10,fg=colour14"

set -g display-panes-active-colour colour8
set -g display-panes-colour colour14
setw -g clock-mode-colour colour40

# #{prefix_highlight} is interpolated by the plugin below. Keep status-right
# cheap: it is redrawn on status-interval, so anything shelling out here is paid
# for repeatedly and forever.
set -g status-left '#[fg=colour15,bg=colour11,bold] ❐ #S #[fg=colour11,bg=colour8,nobold]#{prefix_highlight}'
set -g status-right '#[fg=colour11] %R  %d %b #[fg=colour11,bg=colour10,bold] #h '
# #F carries the alerts: '#' for activity, '!' for a bell, '-' for the last
# window, 'Z' for a zoomed pane. It costs a column only when there is something
# to say, which suits a status bar that is rarely full width.
#
# No #[fg=...] of its own on purpose: an inline colour here is applied after
# window-status-activity-style and overrides it, so an alerting window would be
# styled and then un-styled. The -style options above do the colouring.
setw -g window-status-format " #I #W#F "
# The zoom flag rather than #F: in the current window #F is always '*', which
# the highlight already says. Forgetting a pane is zoomed is the one that costs
# you something.
setw -g window-status-current-format "#[fg=colour8,bg=colour10]#[fg=colour14,bg=colour10,noreverse,bold] #I  #W#{?window_zoomed_flag, Z,} #[fg=colour10,bg=colour8,nobold]"

# ------------------------------------------------------------------ plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# @plugin is tpm's current spelling; the @tpm_plugins variable is legacy.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @continuum-restore 'on'

# Options are read when tpm sources the plugin, so they belong above the run
# below. Copy and sync mode are the reason this is a plugin rather than a
# #{?client_prefix,...} conditional: it reports all three states, in gotham's
# colours, and red for sync because typing into every pane at once is worth
# noticing.
set -g @prefix_highlight_prefix_prompt '#{prefix}'
set -g @prefix_highlight_copy_prompt 'COPY'
set -g @prefix_highlight_sync_prompt 'SYNC'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_fg 'colour8'
set -g @prefix_highlight_bg 'colour4'
set -g @prefix_highlight_copy_mode_attr 'fg=colour8,bg=colour11,bold'
set -g @prefix_highlight_sync_mode_attr 'fg=colour8,bg=colour1,bold'
set -g @prefix_highlight_output_prefix ' '
set -g @prefix_highlight_output_suffix ' '

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
